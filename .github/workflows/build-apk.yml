name: Build APK

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: proximachat/package-lock.json

      - name: Install npm dependencies
        working-directory: proximachat
        run: npm install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "ndk;27.3.13750724"

      - name: Make gradlew executable
        working-directory: proximachat/android
        run: chmod +x gradlew

      - name: Generate debug keystore
        working-directory: proximachat/android/app
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build release APK
        working-directory: proximachat/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProximaChat-release
          path: proximachat/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
