# This is the updated build workflow

name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Set up Android SDK
        uses: r0adkll/setup-android@v1
        with:
          api-level: '30'
          build-tools: '30.0.3'

      - name: Clean and Build APK
        run: |
          ./gradlew clean assembleRelease --no-daemon

      - name: Disable Kotlin incremental compilation if needed
        env:
          GRADLE_OPTS: "-Dkotlin.incremental=false"

      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk
