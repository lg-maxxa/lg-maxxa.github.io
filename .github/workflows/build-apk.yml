name: Build ProximaChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - copilot/convert-to-final-apk
    paths:
      - 'proximachat/**'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: proximachat/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: proximachat
        run: npm ci

      - name: Generate debug keystore
        working-directory: proximachat/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        working-directory: proximachat/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: proximachat/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proximachat-release-apk
          path: proximachat/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
