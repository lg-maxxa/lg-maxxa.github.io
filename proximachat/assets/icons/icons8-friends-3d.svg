<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 3D People/Friends Icon -->
  <defs>
    <linearGradient id="friendsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0051BA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="32" cy="55" rx="20" ry="4" fill="#000" opacity="0.08"/>
  
  <!-- First person (left) -->
  <circle cx="20" cy="14" r="7" fill="url(#friendsGradient)" filter="url(#shadow2)"/>
  <path d="M 10 28 Q 10 24 14 24 L 26 24 Q 30 24 30 28 L 30 38 Q 30 42 26 42 L 14 42 Q 10 42 10 38 Z" fill="url(#friendsGradient)"/>
  
  <!-- Second person (right) -->
  <circle cx="44" cy="14" r="7" fill="url(#friendsGradient)" filter="url(#shadow2)"/>
  <path d="M 34 28 Q 34 24 38 24 L 50 24 Q 54 24 54 28 L 54 38 Q 54 42 50 42 L 38 42 Q 34 42 34 38 Z" fill="url(#friendsGradient)"/>
  
  <!-- Highlight effect -->
  <circle cx="18" cy="11" r="3" fill="white" opacity="0.4"/>
  <circle cx="42" cy="11" r="3" fill="white" opacity="0.4"/>
  
  <!-- Plus sign (add friends) -->
  <circle cx="32" cy="50" r="8" fill="#34C759" filter="url(#shadow2)"/>
  <line x1="28" y1="50" x2="36" y2="50" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="54" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
