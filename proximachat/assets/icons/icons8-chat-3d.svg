<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 3D Chat Bubble -->
  <defs>
    <linearGradient id="chatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#075E54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128C7E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shadow/3D Depth -->
  <ellipse cx="32" cy="50" rx="18" ry="4" fill="#000" opacity="0.08"/>
  
  <!-- Main bubble (3D front) -->
  <path d="M 12 10 Q 8 10 8 14 L 8 40 Q 8 44 12 44 L 42 44 Q 46 44 46 40 L 46 14 Q 46 10 42 10 L 12 10 Z" fill="url(#chatGradient)" filter="url(#shadow)"/>
  
  <!-- Highlight (3D effect) -->
  <ellipse cx="20" cy="18" rx="8" ry="6" fill="white" opacity="0.3"/>
  
  <!-- Tail -->
  <path d="M 38 44 L 48 54 L 42 44 Z" fill="url(#chatGradient)"/>
  
  <!-- Message lines (text indicator) -->
  <line x1="14" y1="22" x2="28" y2="22" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="14" y1="30" x2="40" y2="30" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="14" y1="38" x2="36" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
