<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 3D Radar/Discovery Icon -->
  <defs>
    <linearGradient id="radarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D70015;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="32" cy="52" rx="18" ry="4" fill="#000" opacity="0.08"/>
  
  <!-- Concentric radius circles (radar effect) -->
  <circle cx="32" cy="28" r="4" fill="url(#radarGradient)" filter="url(#shadow3)"/>
  <circle cx="32" cy="28" r="12" fill="none" stroke="url(#radarGradient)" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="28" r="20" fill="none" stroke="url(#radarGradient)" stroke-width="2" opacity="0.4"/>
  
  <!-- Radar sweep lines -->
  <line x1="32" y1="28" x2="32" y2="8" stroke="url(#radarGradient)" stroke-width="2" opacity="0.8"/>
  <line x1="32" y1="28" x2="44" y2="16" stroke="url(#radarGradient)" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="28" x2="48" y2="28" stroke="url(#radarGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Central hub -->
  <circle cx="32" cy="28" r="6" fill="white" opacity="0.2"/>
  
  <!-- Highlight -->
  <circle cx="28" cy="24" r="2" fill="white" opacity="0.5"/>
</svg>
