<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 3D Bell/Requests Icon -->
  <defs>
    <linearGradient id="bellGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB200;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="32" cy="54" rx="16" ry="3" fill="#000" opacity="0.08"/>
  
  <!-- Bell body -->
  <path d="M 20 20 Q 20 12 32 12 Q 44 12 44 20 L 44 32 Q 44 36 32 40 Q 20 36 20 32 Z" fill="url(#bellGradient)" filter="url(#shadow4)"/>
  
  <!-- Bell highlight (3D effect) -->
  <ellipse cx="28" cy="18" rx="6" ry="4" fill="white" opacity="0.35"/>
  
  <!-- Clapper -->
  <rect x="28" y="40" width="8" height="8" rx="2" fill="url(#bellGradient)"/>
  
  <!-- Notification badge (red) -->
  <circle cx="46" cy="16" r="7" fill="#FF3B30" filter="url(#shadow4)"/>
  <text x="46" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <!-- Badge highlight -->
  <circle cx="42" cy="13" r="2" fill="white" opacity="0.5"/>
  
  <!-- Shine on bell -->
  <ellipse cx="35" cy="24" rx="3" ry="2" fill="white" opacity="0.2"/>
</svg>
