<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 3D Send Arrow Icon -->
  <defs>
    <linearGradient id="sendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#128C7E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075E54;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow7" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="32" cy="52" rx="14" ry="3" fill="#000" opacity="0.08"/>
  
  <!-- Arrow shaft -->
  <path d="M 14 34 L 44 34 L 44 30 Z" fill="url(#sendGradient)" filter="url(#shadow7)"/>
  
  <!-- Arrow head -->
  <path d="M 44 20 L 52 32 L 44 44 L 40 32 Z" fill="url(#sendGradient)" filter="url(#shadow7)"/>
  
  <!-- Highlight on arrow -->
  <path d="M 16 31 L 40 31 L 40 29 Z" fill="white" opacity="0.3"/>
  <path d="M 46 24 L 50 32 L 46 40 L 44 32 Z" fill="white" opacity="0.25"/>
  
  <!-- Subtle rotation indicator -->
  <circle cx="32" cy="32" r="2" fill="white" opacity="0.4"/>
</svg>
